workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH == "cicd/documentation"'
    - when: never

stages:
  - test
  - sonar
  - build
  - push
  - deploy
  - release

include:
    - project: 'IUT_INF63/generic-ci'
      ref: 'main'
      file:
        - 'deploy/.docker-deploy.yml'

test:
  stage: test
  image: python:3.10
  before_script:
    - python -m pip install --upgrade pip
    - pip install pytest
    - |
      if [ -f tests/requirements.txt ]; then pip install -r tests/requirements.txt; fi
    - pip install -e .
  script:
    - pytest
  only:
    - master
  when : manual

build_docs:
  stage: build
  image: python:3.9
  before_script:
    - export LC_ALL=C.UTF-8
    - export LANG=C.UTF-8
    - python -m pip install --upgrade pip --root-user-action=ignore
    - pip install -r docs/requirements.txt --root-user-action=ignore
  script:
    - sphinx-build -b html docs docs/_build/html
  artifacts:
    paths:
      - docs/
    expire_in: 1 week
  only:
    - main
    - dev
    - cicd/documentation

push-documentation-image:
  extends: .build-and-push-docker-image
  stage: push
  variables: 
    DOCKERFILE_RELATIVE_PATH: ./docs/Dockerfile
    DOCKERFILE_CONTEXT_PATH: ./docs
    DESTINATION_REGISTRY_IMAGE_NAME: $CI_REGISTRY_IMAGE/orbispanora-docs
    DESTINATION_REGISTRY_IMAGE_VERSION: "latest"
  dependencies:
    - build_docs
  allow_failure: true
  only:
    - master
    - cicd/documentation

sonarqube-check:
  stage: sonar
  image: 
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  
    GIT_DEPTH: "0"  
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script: 
    - sonar-scanner
  allow_failure: true
  only:
    - main
    - dev

build_wheel:
  stage: build
  image: python:3.10
  before_script:
    - python -m pip install --upgrade pip
    - pip install build
  script:
    - python -m build --wheel
  artifacts:
    paths:
      - dist/*.whl
    expire_in: 1 week
  only:
    - main

deploy-documentation:
    extends: .deploy-image
    stage: deploy
    dependencies:
      - push-documentation-image
    variables:
        CONTAINER_NAME: orbispanora-docs
        CONTAINER_IMAGE_PATH: $CI_REGISTRY_IMAGE/orbispanora-docs:latest
        NAMESPACE_TOKEN: $KUBE_NAMESPACE_TOKEN
        NAMESPACE_NAME: iut-inf63-projets-etudiants-orbispanora
    allow_failure: true
    only:
      - master
      - cicd/documentation

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  dependencies:
    - build_wheel
  script:
    - WHEEL_FILE=$(ls dist/*.whl | head -n1 | xargs basename)
    - VERSION=$(echo "$WHEEL_FILE" | sed -E 's/^[^-]+-([^-]+)-.*$/\1/')
    - LABEL="orbispanora-parser-${VERSION}.whl"
    - release-cli create --tag-name "v${VERSION}" --name "Release ${VERSION}" --description "Release ${VERSION} of orbispanora-parser" --assets-link "{\"name\":\"${LABEL}\",\"url\":\"${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/dist/${WHEEL_FILE}?job=build_wheel\"}"
  only:
    - main