workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
    - when: never

stages:
  - test
  - build
  - push
  - deploy
  - release

include:
    - project: 'IUT_INF63/generic-ci'
      ref: 'main'
      file:
        - 'build/.docker-build.yml' 
        - 'deploy/.docker-deploy.yml'

test:
  stage: test
  image: python:3.14
  before_script:
    - pip install uv==0.12.10
  script:
    - uv run --locked pytest
  only:
    - master
  when : manual

build_docs:
  stage: build
  image: python:3.14
  before_script:
    - pip install uv==0.12.10
    - export LC_ALL=C.UTF-8
    - export LANG=C.UTF-8
  script:
    - uv run --locked --group docs sphinx-build -b html docs docs/_build/html
  artifacts:
    paths:
      - docs/
    expire_in: 1 week
  only:
    - main
    - dev

push-documentation-image:
  extends: .build-and-push-docker-image
  stage: push
  variables: 
    DOCKERFILE_RELATIVE_PATH: ./docs/Dockerfile
    DOCKERFILE_CONTEXT_PATH: ./docs
    DESTINATION_REGISTRY_IMAGE_NAME: $CI_REGISTRY_IMAGE/orbispanora-docs
    DESTINATION_REGISTRY_IMAGE_VERSION: "latest"
  dependencies:
    - build_docs
  allow_failure: true
  only:
    - master
    - cicd/documentation

build_wheel:
  stage: build
  image: python:3.14
  before_script:
    - pip install uv==0.12.10
  script:
    - uv build --wheel
  artifacts:
    paths:
      - dist/*.whl
    expire_in: 1 week
  only:
    - main

deploy-documentation:
    extends: .deploy-image
    stage: deploy
    dependencies:
      - push-documentation-image
    variables:
        CONTAINER_NAME: orbispanora-docs
        CONTAINER_IMAGE_PATH: $CI_REGISTRY_IMAGE/orbispanora-docs:latest
        NAMESPACE_TOKEN: $KUBE_NAMESPACE_TOKEN
        NAMESPACE_NAME: iut-inf63-projets-etudiants-orbispanora
    allow_failure: true
    only:
      - master

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  dependencies:
    - build_wheel
  script:
    - WHEEL_FILE=$(ls dist/*.whl | head -n1 | xargs basename)
    - VERSION=$(echo "$WHEEL_FILE" | sed -E 's/^[^-]+-([^-]+)-.*$/\1/')
    - LABEL="orbispanora-parser-${VERSION}.whl"
    - release-cli create --tag-name "v${VERSION}" --name "Release ${VERSION}" --description "Release ${VERSION} of orbispanora-parser" --assets-link "{\"name\":\"${LABEL}\",\"url\":\"${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/dist/${WHEEL_FILE}?job=build_wheel\"}"
  only:
    - main