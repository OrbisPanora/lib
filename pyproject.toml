[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orbispanora-lib"
version = "1.0.0"
description = "Parser and writer for the Minecraft Anvil file format (fork of anvil-parser2), used by the OrbisPanora API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OrbisPanora" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "nbt>=1.5.1",
    "frozendict>=2.5.1",
]

[project.urls]
Homepage = "https://codefirst.iut.uca.fr/gitlab/IUT_INF63/projets-etudiants/OrbisPanora/lib"

[dependency-groups]
dev = ["pytest>=9.2"]
docs = ["sphinx>=8", "sphinx-rtd-theme>=3.0"]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools]
packages = ["anvil", "patterns"]

[tool.setuptools.package-data]
anvil = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(levelname)8s %(message)s"
filterwarnings = [
    # raised by the nbt library
    "ignore::DeprecationWarning",
]
