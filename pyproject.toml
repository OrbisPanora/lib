[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orbispanora-lib"
version = "0.2.0rc2"
description = "Parser and writer for the Minecraft Anvil file format (fork of anvil-parser2), used by the OrbisPanora API."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OrbisPanora" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "nbt>=1.5.1",
    "frozendict>=2.5.1",
]

[project.optional-dependencies]
# Decoding a whole chunk into an array (Chunk.block_array).
fast = ["numpy>=2.3"]

[project.urls]
Homepage = "https://github.com/OrbisPanora/lib"
Issues = "https://github.com/OrbisPanora/lib/issues"

[dependency-groups]
dev = ["pytest>=9.2", "pytest-cov>=7.1", "pylint>=4.0", "ty>=0.0.80", "numpy>=2.3"]
docs = ["sphinx>=8", "sphinx-rtd-theme>=3.0"]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools]
packages = ["orbispanora_lib", "orbispanora_lib.anvil", "orbispanora_lib.patterns"]

[tool.setuptools.package-data]
"orbispanora_lib.anvil" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(levelname)8s %(message)s"
filterwarnings = [
    # raised by the nbt library
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["orbispanora_lib"]

[tool.coverage.report]
fail_under = 80
show_missing = true
