name: Release

# Builds the wheel and the source distribution for a version tag and attaches them to a
# GitHub Release. The tag must be v followed by the version in pyproject.toml. The tests,
# lint and type check run again before anything is published.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.10"

jobs:
  verify:
    name: Version, tests and lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag names the project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          echo "tag=$TAG version=$version"
          [ "$TAG" = "v$version" ] || { echo "The tag and the version differ." >&2; exit 1; }

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"

      - name: Install
        run: uv sync --locked

      - name: Tests
        run: uv run --locked pytest --cov

      - name: Lint and types
        run: |
          uv run --locked pylint --rcfile=.github/workflows/pylintrc --fail-under=9.5 orbispanora_lib
          uv run --locked ty check

  publish:
    name: GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"

      - name: Build
        run: uv build

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          # Not dist/*: uv build also writes a .gitignore into dist/.
          files: |
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
