name: CI

# Tests with coverage, lint, type check, documentation build and a scan of the locked
# dependencies. Runs on every push to main or dev and on every pull request to main.

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.10"

jobs:
  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"

      - name: Install
        run: uv sync --locked

      # Coverage settings, including the 80 % minimum, are in pyproject.toml.
      - name: Run pytest
        run: uv run --locked pytest --cov --cov-report=term-missing

  lint:
    name: Pylint and ty
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"

      - name: Install
        run: uv sync --locked

      - name: Run pylint
        run: uv run --locked pylint --rcfile=.github/workflows/pylintrc --fail-under=9.5 orbispanora_lib

      - name: Run ty
        run: uv run --locked ty check

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"

      # -W turns every Sphinx warning into an error.
      - name: Build the documentation
        run: uv run --locked --group docs sphinx-build -W -b html docs docs/_build/html

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"

      - name: Export the locked requirements
        run: uv export --locked --no-emit-project --format requirements.txt > "$RUNNER_TEMP/requirements.txt"

      - name: Look for known vulnerabilities
        run: uvx pip-audit --requirement "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip
